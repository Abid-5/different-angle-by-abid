<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-label="Cinematic rainy window scene">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08110f"/>
      <stop offset="0.46" stop-color="#131313"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="gold" cx="28%" cy="62%" r="52%">
